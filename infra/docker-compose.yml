# The datastores are always on; the application services live behind the `app`
# profile so `docker compose up -d` gives you what `pnpm dev` needs and nothing
# else.
#
#   docker compose -f infra/docker-compose.yml up -d              # postgres + redis
#   docker compose -f infra/docker-compose.yml --profile app up -d --build

# Explicit, and not optional. Without it Compose derives the project name from the
# containing directory, which is `infra` in every project in this portfolio, and
# bringing up a second stack evicts the first one's containers AND its volumes.
name: forms

services:
  postgres:
    image: postgres:16-alpine
    container_name: forms-postgres
    environment:
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: forms
      POSTGRES_DB: forms
    # 5432 is the dev host's own PostgreSQL and 5433-5440 belong to the sibling
    # portfolio stacks (5439 to an unrelated one), so this project takes 5441 and
    # every URL in .env.example matches.
    ports:
      - '5441:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forms -d forms']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forms-redis
    # Redis holds the rate-limit counters and the results cache. Both are
    # rebuildable, so no AOF: a restart that drops the cache costs one slow
    # results page, and that is the whole failure.
    ports:
      - '6387:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- The application, behind the `app` profile --------------------------------
  #
  #   docker compose -f infra/docker-compose.yml --profile app up -d --build
  #
  # Inside the network the services reach the datastores by name, so the URLs
  # below override the localhost ones .env carries for `pnpm dev`. Everything else
  # (AUTH_SECRET, the tuning knobs) comes from ../.env unchanged.

  # One-shot: apply migrations and seed the demo workspace, then exit. Built from
  # the api Dockerfile's `build` stage, which still has the Prisma CLI and tsx
  # (the runtime image deliberately has neither). The apps wait for it to exit 0,
  # so they never boot against a schema that is behind the code.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: build
    image: forms-migrate
    container_name: forms-migrate
    profiles: ['app']
    env_file:
      - ../.env
    environment: &datastores
      DATABASE_URL: postgresql://forms:forms@postgres:5432/forms?schema=public
      DIRECT_DATABASE_URL: postgresql://forms:forms@postgres:5432/forms?schema=public
      REDIS_URL: redis://redis:6379
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @forms/db exec prisma migrate deploy && pnpm --filter @forms/db run seed',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: forms-api
    container_name: forms-api
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *datastores
      PORT: ''
      API_PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: forms-web
    container_name: forms-web
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: '3000'
      API_BASE_URL: http://api:4000
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
